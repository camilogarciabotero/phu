<text x="783" y="370" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#52606d">filled dot = representative</text>
<text x="526" y="388" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">viral OTUs with MIUViG-style defaults</text>
<text x="526" y="410" font-size="10.5" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="normal" text-anchor="start" fill="#52606d">clusters.tsv · cluster-representatives.fna</text>
<rect x="942" y="212" width="400" height="214" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<rect x="958" y="228" width="150" height="24" rx="12.0" fill="#d35400" stroke="#d35400" stroke-width="0"/>
<text x="1033.0" y="244.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#ffffff">--mode species</text>
<text x="958" y="278" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">complete linkage</text>
<text x="958" y="297" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">total ANI (TANI) ≥ 95%</text>
<text x="958" y="316" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">prefilter identity 70%</text>
