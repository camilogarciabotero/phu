[project]
name = "phu"
version = "0.10.0"
description = "Phage bioinformatics utilities (seqclust runner and friends)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Camilo García-Botero", email = "ca.garcia2@uniandes.edu.co" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7,<8.2",
    # avger neighbourhood context. igua is GPL-3.0-or-later; pymmseqs bundles
    # MMseqs2 (GPL-3.0), which phu runs as a separate program.
    "gb-io>=0.4,<0.5",
    "igua>=0.2.3,<0.3",
    "pymmseqs>=1.2",
    "rich>=13.7,<16",
    "pandas>=2.3.2",
    # 0.6+ wheels need glibc 2.34 and the source build needs a C++20 compiler;
    # 0.5.x wheels run on glibc 2.17+, which older HPC systems still have.
    "pyfamsa>=0.5.3,<0.6",
    "psutil>=5.9",
    "pyhmmer>=0.11.1",
    "pytrimal>=0.8.0",
    "pyrodigal>=3.6.3.post1",
    "pyrodigal-gv>=0.3.2",
    "typer>=0.17.3",
    "vclust>=1.0.0",
]

[project.scripts]
phu = "phu.cli:main"

[tool.setuptools.package-data]
phu = ["data/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
lint = [
    "ruff>=0.12.11",
]
