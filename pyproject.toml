[project]
name = "phu"
version = "0.9.0.dev0"
description = "Phage bioinformatics utilities (seqclust runner and friends)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Camilo García-Botero", email = "ca.garcia2@uniandes.edu.co" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7,<9",
    "rich>=13.7,<=15",
    "pandas>=2.3.2",
    "pyhmmer>=0.11.1",
    "pyrodigal>=3.6.3.post1",
    "pyrodigal-gv>=0.3.2",
    "typer>=0.17.3",
]

[project.scripts]
phu = "phu.cli:main"

[tool.setuptools.package-data]
phu = ["data/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.4.1"
]
lint = [
    "ruff>=0.12.11",
]
