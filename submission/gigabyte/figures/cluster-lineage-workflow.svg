<circle cx="1216" cy="336" r="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.8"/>
<circle cx="1250" cy="336" r="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.8"/>
<text x="1215" y="370" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#52606d">filled dot = representative</text>
<text x="958" y="388" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">species groups with ICTV-style defaults</text>
<text x="958" y="410" font-size="10.5" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="normal" text-anchor="start" fill="#52606d">species-clusters.tsv · cluster-representatives.fna</text>
<text x="700" y="458" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#52606d">anything else goes through --vclust-params, straight to vclust</text>
<rect x="30" y="502" width="1340" height="350" rx="10" fill="#f7f9fb" stroke="#9aa5b1" stroke-width="1.2"/>
<circle cx="54" cy="528" r="13" fill="#1f2933" stroke="none" stroke-width="1.2"/>
<text x="54" y="533" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#ffffff">B</text>
<text x="76" y="533" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f2933">phu normalize-lineage: compact codes for vConTACT predictions</text>
<text x="58" y="566" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">A vConTACT3 assignment table keeps its columns; only the lineage cells change:</text>
<rect x="58" y="584" width="650" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="70" y="604" font-size="11.5" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="normal" text-anchor="start" fill="#1f2933">novel_genus_1_of_Viruses</text>
<line x1="722" y1="599" x2="770" y2="599" stroke="#52606d" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="584" width="300" height="30" rx="4" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="790" y="604" font-size="12" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="bold" text-anchor="start" fill="#8e44ad">Viruses:NG1</text>
<rect x="58" y="626" width="650" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="70" y="646" font-size="11.5" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="normal" text-anchor="start" fill="#1f2933">novel_genus_1_of_novel_family_2_of_unplaced_order_within_Caudoviricetes</text>
<line x1="722" y1="641" x2="770" y2="641" stroke="#52606d" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="626" width="300" height="30" rx="4" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="790" y="646" font-size="12" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="bold" text-anchor="start" fill="#8e44ad">Caudoviricetes:UO:NF2:NG1</text>
<rect x="58" y="668" width="650" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="70" y="688" font-size="11.5" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="normal" text-anchor="start" fill="#1f2933">unplaced_phylum_within_unplaced_kingdom_within_default</text>
<line x1="722" y1="683" x2="770" y2="683" stroke="#52606d" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="778" y="668" width="300" height="30" rx="4" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="790" y="688" font-size="12" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="bold" text-anchor="start" fill="#8e44ad">DEF:UK:UP</text>
<text x="58" y="740" font-size="12" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f2933">How a value is rewritten</text>
<text x="76" y="762" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">the anchor (the last known taxon) comes first; codes follow from the highest rank to the lowest</text>
<text x="76" y="781" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">N = novel node with its number · U = unplaced node (no number) · DEF = the placeholder anchor 'default'</text>
<text x="76" y="800" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">rank letters: R K P C O F SF G (realm to genus); each node must be of a lower rank than the one before it</text>
<text x="778" y="740" font-size="12" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f2933">Safety</text>
<text x="796" y="762" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">unparsed values are kept and counted in the QA summary; --strict makes them fatal</text>
<text x="796" y="781" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">already-compact values are left alone, so the command is idempotent</text>
<text x="796" y="800" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">--add-lineage appends one combined lineage column; nothing else is added or renamed</text>
<text x="700.0" y="956" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#52606d">Clusters and lineage values shown are illustrative.</text>
<text x="700.0" y="976" font-size="10.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#52606d">Recipes follow the vclust use cases; defaults follow MIUViG and ICTV practice · lineage grammar: vConTACT3 novel_/unplaced_ chains</text>
</svg>
