<text x="351" y="370" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#52606d">filled dot = representative</text>
<text x="94" y="388" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#52606d">one representative per group of near-duplicates</text>
<text x="94" y="410" font-size="10.5" font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-weight="normal" text-anchor="start" fill="#52606d">dereplicated-representatives.fna</text>
<rect x="510" y="212" width="400" height="214" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<rect x="526" y="228" width="150" height="24" rx="12.0" fill="#2e8b57" stroke="#2e8b57" stroke-width="0"/>
<text x="601.0" y="244.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#ffffff">--mode votu</text>
<text x="526" y="278" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">Leiden algorithm</text>
<text x="526" y="297" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">ANI ≥ 95% · coverage ≥ 85%</text>
<text x="526" y="316" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">prefilter identity 95%</text>
