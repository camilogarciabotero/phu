[project]
name = "phu"
version = "0.9.1"
description = "Phage bioinformatics utilities (seqclust runner and friends)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Camilo García-Botero", email = "ca.garcia2@uniandes.edu.co" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7,<8.2",
    "rich>=13.7,<16",
    "pandas>=2.3.2",
    # 0.6+ wheels need glibc 2.34 and the source build needs a C++20 compiler;
    # 0.5.x wheels run on glibc 2.17+, which older HPC systems still have.
    "pyfamsa>=0.5.3,<0.6",
    "pyhmmer>=0.11.1",
    "pytrimal>=0.8.0",
    "pyrodigal>=3.6.3.post1",
    "pyrodigal-gv>=0.3.2",
    "typer>=0.17.3",
    "vclust>=1.0.0",
]

[project.scripts]
phu = "phu.cli:main"

[tool.setuptools.package-data]
phu = ["data/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
lint = [
    "ruff>=0.12.11",
]
