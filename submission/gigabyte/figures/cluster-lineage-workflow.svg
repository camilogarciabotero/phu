<text x="1030" y="142" font-size="12" font-weight="bold" font-style="normal" text-anchor="start" fill="#8e44ad">vclust [10]</text>
<rect x="78" y="212" width="400" height="214" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<rect x="94" y="228" width="150" height="24" rx="12.0" fill="#2f6fb0" stroke="#2f6fb0" stroke-width="0"/>
<text x="169.0" y="244.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#ffffff">--mode dereplication</text>
<text x="94" y="278" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">cd-hit algorithm</text>
<text x="94" y="297" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">ANI ≥ 95% · coverage ≥ 85%</text>
<text x="94" y="316" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1f2933">prefilter identity 95%</text>
